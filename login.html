<style>

<script>
let currentTarget = 'client.html';

function setRole(role) {
  const emailInput = document.getElementById('login-email');
  const submitBtn = document.getElementById('submitBtn');
  if (role === 'admin') {
    currentTarget = 'admin.html';
    emailInput.value = 'elena.vance@sanctuary.studio';
    submitBtn.innerHTML = `<span>Sign In to Studio Admin</span> <i class="fas fa-arrow-right ml-2 rtl:rotate-180"></i>`;
  } else {
    currentTarget = 'client.html';
    emailInput.value = 'sophia.reyes@sanctuary.studio';
    submitBtn.innerHTML = `<span>Sign In to Member Portal</span> <i class="fas fa-arrow-right ml-2 rtl:rotate-180"></i>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // 1. Theme Toggle
  const themeBtn = document.getElementById('theme-toggle');
  function setTheme(isDark) {
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    document.documentElement.setAttribute('data-theme', 'sanctuary-green');
    const moon = themeBtn?.querySelector('.fa-moon');
    const sun = themeBtn?.querySelector('.fa-sun');
    if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
    else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('dark'));
    });
  }
  const savedTheme = localStorage.getItem('theme');
  setTheme(savedTheme === 'dark');

  // 2. RTL Toggle
  const rtlBtn = document.getElementById('rtl-toggle');
  function setRTL(isRTL) {
    document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', isRTL ? 'ar' : 'en');
    localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
  }
  const savedDir = localStorage.getItem('dir');
  setRTL(savedDir === 'rtl');
  if (rtlBtn) {
    rtlBtn.addEventListener('click', () => {
      setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
    });
  }

  // 3. Password Toggle
  document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if (input) {
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        const icon = this.querySelector('i');
        if (icon) {
          icon.classList.toggle('fa-eye-slash');
          icon.classList.toggle('fa-eye');
        }
      }
    });
  });

  // 4. Social login placeholder
  window.socialLogin = function(provider) {
    alert(`Sign in with ${provider} connected. Redirecting to practice sanctuary...`);
    window.location.href = currentTarget;
  };

  // 5. Demo login â€” redirect to dashboard
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.toLowerCase();
    if (email.includes('admin') || email.includes('director') || currentTarget === 'admin.html') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'client.html';
    }
  });

  // 6. Forgot password link
  document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
    e.preventDefault();
    alert('A password reset link has been dispatched to your email address.');
  });
});
</script>
</body>
</html>

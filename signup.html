<style>

<!-- ===== SCRIPTS ===== -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. Theme Toggle
  const themeBtn = document.getElementById('theme-toggle');
  function setTheme(isDark) {
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    document.documentElement.setAttribute('data-theme', 'sanctuary-green');
    const moon = themeBtn?.querySelector('.fa-moon');
    const sun = themeBtn?.querySelector('.fa-sun');
    if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
    else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('dark'));
    });
  }
  const savedTheme = localStorage.getItem('theme');
  setTheme(savedTheme === 'dark');

  // 2. RTL Toggle
  const rtlBtn = document.getElementById('rtl-toggle');
  function setRTL(isRTL) {
    document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', isRTL ? 'ar' : 'en');
    localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
  }
  const savedDir = localStorage.getItem('dir');
  setRTL(savedDir === 'rtl');
  if (rtlBtn) {
    rtlBtn.addEventListener('click', () => {
      setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
    });
  }

  // 3. Password Toggle
  document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if (input) {
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        const icon = this.querySelector('i');
        if (icon) {
          icon.classList.toggle('fa-eye-slash');
          icon.classList.toggle('fa-eye');
        }
      }
    });
  });

  // 4. Social signup placeholder
  document.getElementById('googleSignupBtn').addEventListener('click', function() {
    alert('Connecting with Google account... Redirecting to Welcome Flow.');
    window.location.href = 'login.html';
  });
  document.getElementById('appleSignupBtn').addEventListener('click', function() {
    alert('Connecting with Apple ID... Redirecting to Welcome Flow.');
    window.location.href = 'login.html';
  });

  // 5. Demo signup â€” validate & redirect to login
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm-password').value;
    if (password.length < 8) {
      alert('Please choose a password with at least 8 characters.');
      return;
    }
    if (password !== confirm) {
      alert('Passwords do not match. Please verify your password entry.');
      return;
    }
    if (!document.getElementById('terms').checked) {
      alert('Please agree to the Terms of Practice and Privacy Policy.');
      return;
    }
    alert('Welcome to Yoga & Meditation Studio! Your account has been registered. Redirecting to Sign In.');
    window.location.href = 'login.html';
  });

  // 6. Terms & Privacy links
  document.getElementById('termsLink').addEventListener('click', function(e) {
    e.preventDefault();
    alert('Sanctuary Terms of Practice: Respect the silence of the shala, barefoot entry, and mindfulness of fellow practitioners.');
  });
  document.getElementById('privacyLink').addEventListener('click', function(e) {
    e.preventDefault();
    alert('Sanctuary Privacy Policy: Your personal wellness records and contact details are stored securely and never shared.');
  });
});
</script>
</body>
</html>
